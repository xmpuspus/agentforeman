[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentforeman"
dynamic = ["version"]
description = "Approve, steer, and stop every Claude Code agent from one page."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xavier Puspus" }]
keywords = [
    "claude-code",
    "claude",
    "codex",
    "agents",
    "subagents",
    "dashboard",
    "hooks",
    "approvals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.45", "ruff>=0.15,<0.16"]

[project.urls]
Homepage = "https://github.com/xmpuspus/agentforeman"
Repository = "https://github.com/xmpuspus/agentforeman"
Issues = "https://github.com/xmpuspus/agentforeman/issues"
Changelog = "https://github.com/xmpuspus/agentforeman/blob/main/CHANGELOG.md"

[project.scripts]
agentforeman = "agentforeman.cli:main"

[tool.hatch.version]
path = "agentforeman/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentforeman"]

[tool.hatch.build.targets.sdist]
include = [
    "agentforeman",
    "tests",
    "tools",
    "README.md",
    "SPEC.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
]

[tool.ruff.lint]
# The classic default rules, named here so a newer ruff gives the same result.
select = ["E4", "E7", "E9", "F"]
